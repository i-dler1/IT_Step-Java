<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${movie.id == null} ? 'Add Movie' : 'Edit Movie'">Movie Form</title>
    <style>
        .form-container { margin: 20px; padding: 20px; border: 1px solid #ddd; border-radius: 5px; max-width: 500px; }
        .form-group { margin: 15px 0; }
        label { display: inline-block; width: 100px; font-weight: bold; }
        input, select { padding: 5px; width: 250px; }
        .error { color: red; font-size: 0.9em; margin-left: 105px; }
        .buttons { margin-top: 20px; margin-left: 105px; }
        button { padding: 8px 15px; margin-right: 10px; }
    </style>
</head>
<body>
<h1 th:text="${movie.id == null} ? 'Add New Movie' : 'Edit Movie'">Movie Form</h1>

<div class="nav-menu">
    <a href="/movies">Back to List</a>
</div>

<div class="form-container">
    <form action="#" th:action="${movie.id == null} ? '/movies' : '/movies/' + ${movie.id}"
          th:object="${movie}" method="post">

        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" id="title" th:field="*{title}" required />
            <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</div>
        </div>

        <div class="form-group">
            <label for="year">Year:</label>
            <input type="number" id="year" th:field="*{year}" min="1900" max="2026" required />
            <div class="error" th:if="${#fields.hasErrors('year')}" th:errors="*{year}">Year error</div>
        </div>

        <div class="form-group">
            <label for="genre">Genre:</label>
            <select id="genre" th:field="*{genre}" required>
                <option value="">-- Select Genre --</option>
                <option th:each="g : ${allowedGenres}"
                        th:value="${g}"
                        th:text="${g}"
                        th:selected="${g.equals(movie.genre)}">
                    Action
                </option>
            </select>
            <div class="error" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}">Genre error</div>
        </div>

        <div class="form-group">
            <label for="rating">Rating (0-10):</label>
            <input type="number" id="rating" th:field="*{rating}" step="0.1" min="0" max="10" required />
            <div class="error" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}">Rating error</div>
        </div>

        <div class="buttons">
            <button type="submit">Save</button>
            <button type="button" onclick="window.location.href='/movies'">Cancel</button>
        </div>
    </form>
</div>
</body>
</html>
