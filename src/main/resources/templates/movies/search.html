<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Advanced Search</title>
    <style>
        .search-container { margin: 20px; padding: 20px; border: 1px solid #ddd; border-radius: 5px; max-width: 500px; }
        .form-group { margin: 15px 0; }
        label { display: inline-block; width: 120px; font-weight: bold; }
        input, select { padding: 5px; width: 250px; }
        .note { color: #666; font-size: 0.9em; margin-left: 125px; }
        .buttons { margin-top: 20px; margin-left: 125px; }
        button { padding: 8px 15px; margin-right: 10px; }
    </style>
</head>
<body>
<h1>Advanced Movie Search</h1>

<div class="nav-menu">
    <a href="/movies">Back to List</a>
</div>

<div class="search-container">
    <form action="/movies/search" method="get">
        <div class="form-group">
            <label for="genre">Genre:</label>
            <select id="genre" name="genre">
                <option value="">-- Any Genre --</option>
                <option th:each="g : ${allowedGenres}" th:value="${g}" th:text="${g}">Action</option>
            </select>
        </div>

        <div class="form-group">
            <label for="minYear">Min Year:</label>
            <input type="number" id="minYear" name="minYear" min="1900" max="2026" placeholder="e.g. 2000" />
            <div class="note">Leave empty for no minimum</div>
        </div>

        <div class="form-group">
            <label for="maxYear">Max Year:</label>
            <input type="number" id="maxYear" name="maxYear" min="1900" max="2026" placeholder="e.g. 2010" />
            <div class="note">Leave empty for no maximum</div>
        </div>

        <div class="form-group">
            <label for="minRating">Min Rating:</label>
            <input type="number" id="minRating" name="minRating" step="0.1" min="0" max="10" placeholder="e.g. 7.0" />
            <div class="note">Leave empty for no minimum</div>
        </div>

        <div class="form-group">
            <label for="maxRating">Max Rating:</label>
            <input type="number" id="maxRating" name="maxRating" step="0.1" min="0" max="10" placeholder="e.g. 9.0" />
            <div class="note">Leave empty for no maximum</div>
        </div>

        <div class="buttons">
            <button type="submit">Search</button>
            <button type="reset">Reset</button>
        </div>
    </form>
</div>
</body>
</html>
