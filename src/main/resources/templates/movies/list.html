<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movie List</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .message { color: green; padding: 10px; margin: 10px 0; background-color: #e8f5e8; }
        .nav-menu { margin: 20px 0; padding: 10px; background-color: #f8f9fa; }
        .nav-menu a { margin-right: 15px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>
<h1>Movie List</h1>

<div class="nav-menu">
    <a href="/movies">Home</a>
    <a href="/movies/new">Add New Movie</a>
    <a href="/movies/search">Advanced Search</a>
    <a href="/movies/horror/after2000">Horror Movies After 2000</a>
</div>

<div class="message" th:if="${message}" th:text="${message}"></div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Year</th>
        <th>Genre</th>
        <th>Rating</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="movie : ${movies}">
        <td th:text="${movie.id}">1</td>
        <td><a th:href="@{'/movies/' + ${movie.id}}" th:text="${movie.title}">Movie Title</a></td>
        <td th:text="${movie.year}">2020</td>
        <td th:text="${movie.genre}">Drama</td>
        <td th:text="${movie.rating}">8.5</td>
        <td>
            <a th:href="@{'/movies/' + ${movie.id} + '/edit'}">Edit</a>
            |
            <a th:href="@{'/movies/delete/' + ${movie.id}}"
               onclick="return confirm('Are you sure?')">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(movies)}">No movies found.</p>
</body>
</html>
